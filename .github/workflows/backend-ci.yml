name: Backend CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: healthtrackme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw clean test

      - name: Build
        run: ./mvnw package -DskipTests

      - name: Build Docker image
        run: |
          for attempt in 1 2 3; do
            docker build -t healthtrackme-api . && exit 0
            if [ "${attempt}" -eq 3 ]; then
              break
            fi
            delay=$((5 * 3 ** (attempt - 1)))
            echo "Docker build failed on attempt ${attempt}. Retrying in ${delay}s..."
            sleep "${delay}"
          done
          echo "Docker build failed after 3 attempts."
          exit 1

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthtrackme}
    username: ${DATABASE_USERNAME:healthtrackme}
    password: ${DATABASE_PASSWORD:healthtrackme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 10
      min-spare: 2
    accept-count: 50
    max-connections: 100

security:
  jwt:
    secret: ${JWT_SECRET:change-me-local-secret}

google:
  oauth:
    allowed-client-ids: ${GOOGLE_OAUTH_ALLOWED_CLIENT_IDS:}

app:
  data-retention:
    # TODO: Implement user-level hard-delete workflow for "delete my data" GDPR requests.
    delete-my-data-enabled: false
  mail:
    # Set APP_MAIL_ENABLED=true and provide SMTP_USERNAME/SMTP_PASSWORD (Gmail app password)
    # in the deploy environment to enable the "email me my summary" feature.
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:HealthTrackMe <no-reply@healthtrackme.app>}

logging:
  level:
    root: WARN
    com.healthwithme: INFO



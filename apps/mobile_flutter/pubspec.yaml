name: healthtrackme
description: "HealthTrackMe - Health tracking mobile application with Flutter"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  cached_network_image: ^3.3.1
  http: ^1.1.0
  fl_chart: ^0.69.0
  flex_color_scheme: ^8.4.0
  flutter_local_notifications: ^17.0.0
  flutter_slidable: ^3.1.0
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  health: ^13.3.1
  permission_handler: ^11.0.0
  workmanager: ^0.9.0
  vibration: ^3.1.8
  intl: ^0.19.0
  image_picker: ^1.1.0
  lottie: ^3.1.0
  percent_indicator: ^4.2.3
  provider: ^6.1.2
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  shared_preferences: ^2.2.0
  timezone: ^0.9.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_timezone: ^5.1.0
  pedometer: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1F33"
  adaptive_icon_foreground: "assets/images/logo_1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/



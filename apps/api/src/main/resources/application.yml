spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthtrackme}
    username: ${DATABASE_USERNAME:healthtrackme}
    password: ${DATABASE_PASSWORD:healthtrackme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Generous timeouts — a cold cloud->Gmail TLS handshake can exceed a few seconds.
          connectiontimeout: 20000
          timeout: 20000
          writetimeout: 20000

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 10
      min-spare: 2
    accept-count: 50
    max-connections: 100

security:
  jwt:
    secret: ${JWT_SECRET:change-me-local-secret}
    # Token lifetime in seconds (default 30 days so demo testers stay signed in).
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:2592000}
  # When true, all /api/v1/** endpoints except /auth/** require a valid JWT and
  # enforce per-user ownership. Disabled in the test profile.
  auth:
    enabled: ${AUTH_ENABLED:true}

google:
  oauth:
    allowed-client-ids: ${GOOGLE_OAUTH_ALLOWED_CLIENT_IDS:}

anthropic:
  # Set ANTHROPIC_API_KEY in the deploy env to enable AI-powered Detective insights
  # and the "ask your health data" Q&A. When blank, the service falls back to the
  # existing rule-based analysis automatically.
  api:
    key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}

app:
  data-retention:
    # TODO: Implement user-level hard-delete workflow for "delete my data" GDPR requests.
    delete-my-data-enabled: false
  mail:
    # Enable "email me my summary" with APP_MAIL_ENABLED=true, then set ONE transport:
    #  - BREVO_API_KEY (recommended): verify one sender, email any recipient over HTTPS. OR
    #  - RESEND_API_KEY: HTTPS, but needs a verified domain to email arbitrary recipients. OR
    #  - SMTP_USERNAME/SMTP_PASSWORD: Gmail SMTP (often blocked on PaaS hosts).
    enabled: ${APP_MAIL_ENABLED:false}
    # The sender shown on the email. For Brevo this MUST be your verified sender address.
    from: ${APP_MAIL_FROM:HealthTrackMe <healthtrackme@gmail.com>}

# Brevo (https://brevo.com) — HTTPS email API; send from one verified sender to any recipient.
brevo:
  api:
    key: ${BREVO_API_KEY:}

# Resend (https://resend.com) — HTTPS email API alternative.
resend:
  api:
    key: ${RESEND_API_KEY:}

logging:
  level:
    root: WARN
    com.healthwithme: INFO



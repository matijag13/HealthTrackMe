spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthtrackme}
    username: ${DATABASE_USERNAME:healthtrackme}
    password: ${DATABASE_PASSWORD:healthtrackme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  tomcat:
    threads:
      max: 10
      min-spare: 2
    accept-count: 50
    max-connections: 100

security:
  jwt:
    secret: ${JWT_SECRET:change-me-local-secret}

app:
  data-retention:
    # TODO: Implement user-level hard-delete workflow for "delete my data" GDPR requests.
    delete-my-data-enabled: false

logging:
  level:
    root: WARN
    com.healthwithme: INFO



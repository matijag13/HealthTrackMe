services:
  postgres:
    image: postgres:16-alpine
    container_name: healthtrackme-postgres
    environment:
      POSTGRES_DB: healthtrackme
      POSTGRES_USER: healthtrackme
      POSTGRES_PASSWORD: healthtrackme
    ports:
      - "5432:5432"
    volumes:
      - healthtrackme_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthtrackme -d healthtrackme"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  healthtrackme_pg_data:
